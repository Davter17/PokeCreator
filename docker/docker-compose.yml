version: '3.8'

services:
  # Servicio web frontend con React + Vite (Desarrollo)
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: pokecreator-web
    ports:
      - "3000:3000"
    volumes:
      - ../src:/app/src
      - ../index.html:/app/index.html
      - ../tailwind.config.js:/app/tailwind.config.js
      - ../vite.config.ts:/app/vite.config.ts
    restart: unless-stopped
    networks:
      - pokecreator-network

networks:
  pokecreator-network:
    driver: bridge
