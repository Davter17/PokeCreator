services:
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: dev
    container_name: pokecreator-web
    ports:
      - "3000:3000"
    volumes:
      - ../src:/app/src
      - ../index.html:/app/index.html
      - ../tailwind.config.js:/app/tailwind.config.js
      - ../config/vite.config.ts:/app/config/vite.config.ts
      - ../.env:/app/.env
    env_file:
      - ../.env
    restart: unless-stopped
    networks:
      - pokecreator-network

networks:
  pokecreator-network:
    driver: bridge
